# Production stack — AWS EC2 + RDS PostgreSQL (pgvector)
# Independent of docker-compose.yml (local dev). Use only this file on the server:
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Guide: docs/DEPLOYMENT_AWS.md
#
# Expected layout on EC2:
#   /opt/apps/rag-support-assistant-backend   (this repo)
#   /opt/apps/rag-support-assistant-frontend  (frontend repo, built into dist/)

services:
  redis:
    image: redis:7-alpine
    container_name: supportai_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    # No host ports

  web:
    build: .
    container_name: supportai_web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_ENGINE: django.db.backends.postgresql
      REDIS_URL: redis://redis:6379/0
      SEED_DEMO_DATA: "false"
    volumes:
      - media_data:/app/media_uploads
      - static_data:/app/staticfiles
    command:
      [
        "daphne",
        "-b",
        "0.0.0.0",
        "-p",
        "8000",
        "supportai.asgi:application",
      ]
    depends_on:
      redis:
        condition: service_healthy
    # No host ports — Caddy proxies

  caddy:
    image: caddy:2-alpine
    container_name: supportai_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media_data:/srv/media:ro
      - static_data:/srv/static:ro
      - ${FRONTEND_DIST_DIR:-../rag-support-assistant-frontend/dist}:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  media_data:
  static_data:
  caddy_data:
  caddy_config:
